# Publishes a GitHub release with BloomRoute-forever.zip whenever a v* tag is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build BloomRoute-forever.zip
        run: |
          mkdir -p build/BloomRoute
          cp -r BloomRoute.toc BloomRoute_Mainline.toc Forever Vanilla media build/BloomRoute/
          cd build && zip -rqX ../BloomRoute-forever.zip BloomRoute

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" BloomRoute-forever.zip \
            --title "BloomRoute ${GITHUB_REF_NAME#v}" \
            --notes "BloomRoute-forever.zip holds the full BloomRoute folder and works in both WoW Forever and Turtle/Octo WoW (1.12)."
